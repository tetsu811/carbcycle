<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f1115">
<title>碳循環熱量計算</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#0f1115; --card:#1a1d24; --card2:#22262f; --border:#2e333e;
    --text:#e8eaef; --muted:#8a91a0;
    --carb:#f5a623; --fat:#e05c6e; --protein:#4da3ff; --kcal:#5dd39e;
    --low:#4da3ff; --no:#e05c6e; --high:#f5a623;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  body{font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif; background:var(--bg); color:var(--text); min-height:100vh; padding-bottom:40px;}
  .wrap{max-width:520px; margin:0 auto; padding:16px;}
  h1{font-size:20px; font-weight:700; letter-spacing:1px;}
  header{display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;}
  .icon-btn{background:var(--card2); border:1px solid var(--border); color:var(--text); border-radius:10px; padding:8px 12px; font-size:14px; cursor:pointer;}
  .sync{font-size:12px; color:var(--muted); margin-bottom:10px; min-height:16px;}
  .sync .dot{display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:5px; background:var(--muted); vertical-align:1px;}
  .sync.ok .dot{background:var(--kcal);} .sync.busy .dot{background:var(--carb);} .sync.err .dot{background:var(--no);}
  .card{background:var(--card); border:1px solid var(--border); border-radius:16px; padding:14px; margin-bottom:14px;}
  .row{display:flex; gap:8px; align-items:center;}
  input,select{background:var(--card2); border:1px solid var(--border); color:var(--text); border-radius:10px; padding:10px; font-size:16px; width:100%; outline:none;}
  input:focus{border-color:#4a5568;}
  input[type=date]{color-scheme:dark;}
  input[type=number]{-moz-appearance:textfield;}
  input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;}
  .daytype{display:flex; gap:8px; margin-top:10px;}
  .daytype button{flex:1; padding:10px 0; border-radius:12px; border:1px solid var(--border); background:var(--card2); color:var(--muted); font-size:15px; font-weight:600; cursor:pointer; transition:.15s;}
  .daytype button.active-low{background:rgba(77,163,255,.18); border-color:var(--low); color:var(--low);}
  .daytype button.active-no{background:rgba(224,92,110,.18); border-color:var(--no); color:var(--no);}
  .daytype button.active-high{background:rgba(245,166,35,.18); border-color:var(--high); color:var(--high);}
  .suggest-tag{font-size:12px; color:var(--muted); margin-top:8px; text-align:center;}
  .totals{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; text-align:center;}
  .tot{background:var(--card2); border-radius:12px; padding:10px 4px;}
  .tot .v{font-size:20px; font-weight:700;}
  .tot .t{font-size:11px; color:var(--muted); margin-top:2px;}
  .tot .goal{font-size:11px; color:var(--muted);}
  .bar{height:5px; background:var(--border); border-radius:3px; margin-top:6px; overflow:hidden;}
  .bar i{display:block; height:100%; border-radius:3px; transition:width .3s;}
  .over{color:var(--no) !important;}
  .kcal-big{text-align:center; margin:4px 0 12px;}
  .kcal-big .n{font-size:38px; font-weight:800; color:var(--kcal);}
  .kcal-big .n.over{color:var(--no);}
  .kcal-big .s{font-size:13px; color:var(--muted);}
  .addgrid{display:grid; grid-template-columns:1fr; gap:8px;}
  .macro3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px;}
  .macro3 label{font-size:11px; color:var(--muted); display:block; margin-bottom:4px; text-align:center;}
  .addbtn{width:100%; padding:12px; border-radius:12px; border:none; background:var(--kcal); color:#0b2a1e; font-size:16px; font-weight:700; cursor:pointer; margin-top:2px; transition:.15s;}
  .addbtn:active{transform:scale(.98);}
  .est{font-size:13px; color:var(--muted); text-align:center; min-height:18px;}
  .aibtn{background:rgba(93,211,158,.14); border:1px solid var(--kcal); color:var(--kcal); border-radius:10px; padding:10px 12px; font-size:14px; font-weight:600; cursor:pointer; white-space:nowrap; transition:.15s;}
  .aibtn:disabled{opacity:.5;}
  .food{display:flex; align-items:center; gap:8px; padding:10px 2px; border-bottom:1px solid var(--border);}
  .food:last-child{border-bottom:none;}
  .food .name{flex:1; font-size:15px;}
  .food .macros{font-size:12px; color:var(--muted);}
  .food .kc{font-weight:700; font-size:15px; min-width:64px; text-align:right;}
  .food .del{background:none; border:none; color:var(--muted); font-size:18px; cursor:pointer; padding:4px 6px;}
  .empty{text-align:center; color:var(--muted); font-size:14px; padding:16px 0;}
  h2{font-size:14px; color:var(--muted); font-weight:600; margin-bottom:10px; letter-spacing:1px;}
  .hist{display:flex; align-items:center; gap:8px; padding:9px 2px; border-bottom:1px solid var(--border); font-size:14px; cursor:pointer;}
  .hist:last-child{border-bottom:none;}
  .hist .d{min-width:78px;}
  .hist .tag{font-size:11px; padding:2px 8px; border-radius:8px; font-weight:600;}
  .tag-low{background:rgba(77,163,255,.18); color:var(--low);}
  .tag-no{background:rgba(224,92,110,.18); color:var(--no);}
  .tag-high{background:rgba(245,166,35,.18); color:var(--high);}
  .hist .hk{margin-left:auto; font-weight:600;}
  .hist .ok{color:var(--kcal);} .hist .ng{color:var(--no);}
  .autolist{position:relative;}
  .ac{position:absolute; top:100%; left:0; right:0; background:var(--card2); border:1px solid var(--border); border-radius:10px; margin-top:4px; z-index:20; max-height:190px; overflow:auto;}
  .ac div{padding:10px 12px; font-size:14px; cursor:pointer; display:flex; justify-content:space-between; border-bottom:1px solid var(--border);}
  .ac div:last-child{border-bottom:none;}
  .ac div:active{background:var(--border);}
  .ac .m{color:var(--muted); font-size:12px;}
  .modal{position:fixed; inset:0; background:rgba(0,0,0,.6); display:none; align-items:flex-end; justify-content:center; z-index:50;}
  .modal.show{display:flex;}
  .sheet{background:var(--card); border-radius:20px 20px 0 0; width:100%; max-width:520px; padding:18px 16px 30px; max-height:88vh; overflow:auto;}
  .sheet h3{font-size:17px; margin-bottom:14px;}
  .settbl{width:100%; border-collapse:collapse; font-size:14px;}
  .settbl th{color:var(--muted); font-weight:500; font-size:12px; padding:6px 4px; text-align:center;}
  .settbl td{padding:4px;}
  .settbl input{padding:8px 6px; text-align:center; font-size:15px;}
  .settbl .dt{font-weight:700; white-space:nowrap;}
  .kcal-preview{font-size:12px; color:var(--muted); text-align:center; padding-top:2px;}
  .savebtn{width:100%; padding:13px; border-radius:12px; border:none; background:var(--kcal); color:#0b2a1e; font-size:16px; font-weight:700; cursor:pointer; margin-top:16px; transition:.15s;}
  .savebtn:active{transform:scale(.98);}
  .subtle{width:100%; padding:11px; border-radius:12px; border:1px solid var(--border); background:none; color:var(--muted); font-size:14px; cursor:pointer; margin-top:10px;}
  .weekrow{display:grid; grid-template-columns:repeat(7,1fr); gap:5px; margin-top:8px;}
  .weekrow .wd{text-align:center; font-size:11px; color:var(--muted); margin-bottom:3px;}
  .weekrow select{padding:8px 2px; font-size:13px; text-align:center;}
  .note{font-size:12px; color:var(--muted); margin-top:12px; line-height:1.6;}
  /* login */
  .login{position:fixed; inset:0; background:var(--bg); z-index:100; display:none; align-items:center; justify-content:center; padding:24px;}
  .login.show{display:flex;}
  .login-box{width:100%; max-width:340px; text-align:center;}
  .login-box h1{margin-bottom:6px;}
  .login-box p{color:var(--muted); font-size:13px; margin-bottom:22px;}
  .login-box input{margin-bottom:10px; text-align:center;}
  .login-err{color:var(--no); font-size:13px; min-height:18px; margin-top:8px;}
</style>
</head>
<body>

<!-- login overlay -->
<div class="login" id="loginView">
  <div class="login-box">
    <h1>碳循環熱量計算</h1>
    <p>登入後手機、電腦資料自動同步</p>
    <input type="email" id="loginEmail" placeholder="Email" autocomplete="username">
    <input type="password" id="loginPw" placeholder="密碼" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="savebtn" id="loginBtn" onclick="doLogin()">登入</button>
    <div class="login-err" id="loginErr"></div>
  </div>
</div>

<div class="wrap">
  <header>
    <h1>碳循環熱量計算</h1>
    <button class="icon-btn" onclick="openSettings()">⚙ 設定</button>
  </header>
  <div class="sync" id="syncBar"><span class="dot"></span><span id="syncText">載入中…</span></div>

  <div class="card">
    <div class="row">
      <button class="icon-btn" onclick="shiftDate(-1)">‹</button>
      <input type="date" id="datePick" onchange="onDateChange()">
      <button class="icon-btn" onclick="shiftDate(1)">›</button>
    </div>
    <div class="daytype" id="dayTypeBtns"></div>
    <div class="suggest-tag" id="suggestTag"></div>
  </div>

  <div class="card">
    <div class="kcal-big">
      <div class="n" id="kcalNow">0</div>
      <div class="s" id="kcalGoal"></div>
    </div>
    <div class="totals" id="totalsGrid"></div>
  </div>

  <div class="card">
    <h2>新增食物</h2>
    <div class="addgrid">
      <div class="row">
        <div class="autolist" style="flex:1">
          <input type="text" id="fName" placeholder="食物名稱（輸入可帶出吃過的）" autocomplete="off" oninput="showAC()" onfocus="showAC()">
          <div class="ac" id="acBox" style="display:none"></div>
        </div>
        <button class="aibtn" id="aiBtn" onclick="aiEstimate()">✨ AI</button>
      </div>
      <div class="macro3">
        <div><label style="color:var(--carb)">碳水 (g)</label><input type="number" id="fCarb" inputmode="decimal" placeholder="0" oninput="updateEst()"></div>
        <div><label style="color:var(--fat)">脂肪 (g)</label><input type="number" id="fFat" inputmode="decimal" placeholder="0" oninput="updateEst()"></div>
        <div><label style="color:var(--protein)">蛋白質 (g)</label><input type="number" id="fProt" inputmode="decimal" placeholder="0" oninput="updateEst()"></div>
      </div>
      <div class="est" id="estKcal"></div>
      <button class="addbtn" onclick="addFood()">＋ 加入</button>
    </div>
  </div>

  <div class="card">
    <h2>今日紀錄</h2>
    <div id="foodList"></div>
  </div>

  <div class="card">
    <h2>歷史紀錄（近 14 天）</h2>
    <div id="histList"></div>
  </div>
</div>

<!-- settings -->
<div class="modal" id="settingsModal" onclick="if(event.target===this)closeSettings()">
  <div class="sheet">
    <h3>目標設定</h3>
    <table class="settbl">
      <tr><th></th><th style="color:var(--carb)">碳水</th><th style="color:var(--fat)">脂肪</th><th style="color:var(--protein)">蛋白質</th><th>熱量</th></tr>
      <tr><td class="dt" style="color:var(--low)">低碳日</td>
        <td><input type="number" id="s_low_c" oninput="prevKcal()"></td>
        <td><input type="number" id="s_low_f" oninput="prevKcal()"></td>
        <td><input type="number" id="s_low_p" oninput="prevKcal()"></td>
        <td class="kcal-preview" id="s_low_k"></td></tr>
      <tr><td class="dt" style="color:var(--no)">無碳日</td>
        <td><input type="number" id="s_no_c" oninput="prevKcal()"></td>
        <td><input type="number" id="s_no_f" oninput="prevKcal()"></td>
        <td><input type="number" id="s_no_p" oninput="prevKcal()"></td>
        <td class="kcal-preview" id="s_no_k"></td></tr>
      <tr><td class="dt" style="color:var(--high)">高碳日</td>
        <td><input type="number" id="s_high_c" oninput="prevKcal()"></td>
        <td><input type="number" id="s_high_f" oninput="prevKcal()"></td>
        <td><input type="number" id="s_high_p" oninput="prevKcal()"></td>
        <td class="kcal-preview" id="s_high_k"></td></tr>
    </table>
    <h3 style="margin-top:18px">每週循環（自動建議日型）</h3>
    <div class="weekrow" id="weekGrid"></div>
    <div class="note">熱量以 碳水×4 + 脂肪×9 + 蛋白質×4 計算。資料會自動同步到雲端。</div>
    <button class="savebtn" onclick="saveSettings()">儲存</button>
    <button class="subtle" onclick="exportData()">匯出備份 (JSON)</button>
    <button class="subtle" onclick="document.getElementById('importFile').click()">匯入備份（含舊版單機資料）</button>
    <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(this)">
    <button class="subtle" style="color:var(--no); border-color:rgba(224,92,110,.4)" onclick="doLogout()">登出</button>
  </div>
</div>

<script>
// ================= 設定（部署前填入你的 Supabase 資訊） =================
const SUPABASE_URL = 'https://fugpbunpudlaixspijhh.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_fLiV9AhKv4pnXaclPmrQTg_ADidh085';
// =====================================================================

const CONFIGURED = SUPABASE_URL.startsWith('https://');
const sb = CONFIGURED ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
let userId = null;

// ===== local store (cache) =====
const DAY_TYPES = {
  low:  {name:'低碳日', cls:'low'},
  no:   {name:'無碳日', cls:'no'},
  high: {name:'高碳日', cls:'high'},
};
const DEFAULTS = {
  targets: { low:{c:40,f:100,p:180}, no:{c:0,f:100,p:200}, high:{c:200,f:50,p:180} },
  week: ['high','low','low','no','high','low','no'], // 日..六
};
let store = loadLocal();
let dirty = new Set(JSON.parse(localStorage.getItem('cc_dirty')||'[]'));

function loadLocal(){
  try{
    const s = JSON.parse(localStorage.getItem('cc_store')||'{}');
    return {
      settings: s.settings || {targets: JSON.parse(JSON.stringify(DEFAULTS.targets)), week: DEFAULTS.week.slice()},
      lib: s.lib || {},
      days: s.days || {},
    };
  }catch(e){ return {settings:{targets:JSON.parse(JSON.stringify(DEFAULTS.targets)), week:DEFAULTS.week.slice()}, lib:{}, days:{}}; }
}
function persistLocal(){
  try{
    localStorage.setItem('cc_store', JSON.stringify(store));
    localStorage.setItem('cc_dirty', JSON.stringify([...dirty]));
  }catch(e){}
}
function markDirty(key){ dirty.add(key); persistLocal(); scheduleSync(); }

// key <-> store mapping
function dataForKey(key){
  if(key==='settings') return store.settings;
  if(key==='lib') return store.lib;
  if(key.startsWith('day:')) return store.days[key.slice(4)] || null;
  return null;
}
function applyRow(key, data){
  if(key==='settings') store.settings = data;
  else if(key==='lib') store.lib = data;
  else if(key.startsWith('day:')) store.days[key.slice(4)] = data;
}

// ===== sync =====
let syncTimer = null;
function setSync(state, text){
  const bar = document.getElementById('syncBar');
  bar.className = 'sync '+state;
  document.getElementById('syncText').textContent = text;
}
function scheduleSync(){
  if(!CONFIGURED || !userId) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(flushDirty, 800);
}
async function flushDirty(){
  if(!CONFIGURED || !userId || dirty.size===0) return;
  setSync('busy','同步中…');
  const keys = [...dirty];
  const rows = keys.map(k=>({user_id:userId, key:k, data:dataForKey(k)||{}, updated_at:new Date().toISOString()}));
  const {error} = await sb.from('carbcycle').upsert(rows);
  if(error){ setSync('err','同步失敗，稍後重試'); setTimeout(flushDirty, 5000); return; }
  keys.forEach(k=>dirty.delete(k));
  persistLocal();
  setSync('ok','已同步 '+new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'}));
}
async function pullAll(){
  if(!CONFIGURED || !userId) return;
  setSync('busy','下載資料中…');
  const {data, error} = await sb.from('carbcycle').select('key,data');
  if(error){ setSync('err','無法連線，使用本機資料'); return; }
  const serverKeys = new Set();
  (data||[]).forEach(r=>{ serverKeys.add(r.key); if(!dirty.has(r.key)) applyRow(r.key, r.data); });
  // push local-only keys (e.g. imported backup)
  ['settings','lib',...Object.keys(store.days).map(d=>'day:'+d)].forEach(k=>{
    if(!serverKeys.has(k)) dirty.add(k);
  });
  persistLocal();
  render();
  if(dirty.size) flushDirty(); else setSync('ok','已同步');
}

// ===== auth =====
async function initAuth(){
  if(!CONFIGURED){ setSync('err','未設定 Supabase，離線模式'); render(); return; }
  const {data:{session}} = await sb.auth.getSession();
  if(session){ userId = session.user.id; pullAll(); }
  else document.getElementById('loginView').classList.add('show');
  sb.auth.onAuthStateChange((_e, s)=>{
    if(s){ userId = s.user.id; }
  });
}
async function doLogin(){
  const btn = document.getElementById('loginBtn');
  const err = document.getElementById('loginErr');
  btn.textContent='登入中…'; err.textContent='';
  const {error} = await sb.auth.signInWithPassword({
    email: document.getElementById('loginEmail').value.trim(),
    password: document.getElementById('loginPw').value,
  });
  btn.textContent='登入';
  if(error){ err.textContent = 'Email 或密碼錯誤'; return; }
  const {data:{session}} = await sb.auth.getSession();
  userId = session.user.id;
  document.getElementById('loginView').classList.remove('show');
  pullAll();
}
async function doLogout(){
  if(sb) await sb.auth.signOut();
  userId = null;
  closeSettings();
  document.getElementById('loginView').classList.add('show');
}

// refresh when returning to the app
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState==='visible' && userId){
    if(dirty.size) flushDirty(); else pullAll();
  }
});
window.addEventListener('online', ()=>{ if(dirty.size) flushDirty(); });

// ===== helpers =====
const kcalOf = (c,f,p)=> Math.round(c*4 + f*9 + p*4);
const num = v => { const n = parseFloat(v); return isNaN(n)?0:n; };
let curDate = todayStr();
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function getDay(dstr){
  if(!store.days[dstr]) store.days[dstr] = {type: suggestType(dstr), foods:[]};
  return store.days[dstr];
}
function suggestType(dstr){ return store.settings.week[new Date(dstr+'T12:00:00').getDay()]; }

// ===== date & day type =====
function onDateChange(){ curDate = document.getElementById('datePick').value || todayStr(); render(); }
function shiftDate(n){
  const d = new Date(curDate+'T12:00:00'); d.setDate(d.getDate()+n);
  curDate = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  render();
}
function setType(t){ getDay(curDate).type = t; markDirty('day:'+curDate); render(); }

// ===== add food =====
function updateEst(){
  const k = kcalOf(num(fCarb.value), num(fFat.value), num(fProt.value));
  estKcal.textContent = k>0 ? '≈ '+k+' 大卡' : '';
}
function addFood(){
  const n = fName.value.trim();
  const c=num(fCarb.value), f=num(fFat.value), p=num(fProt.value);
  if(!n){ fName.focus(); return; }
  getDay(curDate).foods.push({n,c,f,p});
  markDirty('day:'+curDate);
  if(c||f||p){ store.lib[n] = {c,f,p}; markDirty('lib'); }
  fName.value=fCarb.value=fFat.value=fProt.value='';
  estKcal.textContent=''; hideAC();
  render();
}
function delFood(i){ getDay(curDate).foods.splice(i,1); markDirty('day:'+curDate); render(); }

// AI 估算營養素
async function aiEstimate(){
  const n = fName.value.trim();
  if(!n){ fName.focus(); return; }
  const btn = document.getElementById('aiBtn');
  btn.disabled = true; btn.textContent = '⋯';
  estKcal.textContent = 'AI 估算中…';
  try{
    const {data:{session}} = await sb.auth.getSession();
    if(!session) throw new Error('no session');
    const r = await fetch('/api/food', {
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token},
      body: JSON.stringify({name:n}),
    });
    if(!r.ok) throw new Error('api');
    const d = await r.json();
    fCarb.value = d.c; fFat.value = d.f; fProt.value = d.p;
    updateEst();
    estKcal.textContent = '≈ '+kcalOf(d.c,d.f,d.p)+' 大卡'+(d.serving?'（'+d.serving+'，AI 估算可修改）':'（AI 估算可修改）');
  }catch(e){
    estKcal.textContent = 'AI 估算失敗，請手動輸入或再試一次';
  }
  btn.disabled = false; btn.textContent = '✨ AI';
}

// autocomplete
function showAC(){
  const q = fName.value.trim();
  const names = Object.keys(store.lib).filter(n => !q || n.includes(q)).slice(0,8);
  if(!names.length){ hideAC(); return; }
  acBox.innerHTML = names.map(n=>{
    const m=store.lib[n];
    return `<div onmousedown="pickAC('${n.replace(/'/g,"\\'")}')"><span>${n}</span><span class="m">${m.c}/${m.f}/${m.p}g · ${kcalOf(m.c,m.f,m.p)}卡</span></div>`;
  }).join('');
  acBox.style.display='block';
}
function hideAC(){ acBox.style.display='none'; }
function pickAC(n){
  const m = store.lib[n];
  fName.value=n; fCarb.value=m.c||''; fFat.value=m.f||''; fProt.value=m.p||'';
  updateEst(); hideAC();
}
document.addEventListener('click', e=>{ if(!e.target.closest('.autolist')) hideAC(); });

// ===== render =====
function render(){
  document.getElementById('datePick').value = curDate;
  const day = getDay(curDate);
  const tg = store.settings.targets[day.type];
  const tgK = kcalOf(tg.c,tg.f,tg.p);

  dayTypeBtns.innerHTML = Object.entries(DAY_TYPES).map(([k,v])=>
    `<button class="${day.type===k?'active-'+v.cls:''}" onclick="setType('${k}')">${v.name}</button>`).join('');
  const sug = suggestType(curDate);
  suggestTag.textContent = '循環建議：'+DAY_TYPES[sug].name + (sug!==day.type?'（目前手動選擇）':'');

  let C=0,F=0,P=0;
  day.foods.forEach(x=>{C+=x.c; F+=x.f; P+=x.p;});
  const K = kcalOf(C,F,P);
  kcalNow.textContent = K;
  kcalNow.className = 'n'+(K>tgK?' over':'');
  kcalGoal.textContent = `/ ${tgK} 大卡（${DAY_TYPES[day.type].name}）　剩餘 ${Math.max(0,tgK-K)}`;

  const cells = [
    {label:'碳水', v:C, g:tg.c, color:'var(--carb)'},
    {label:'脂肪', v:F, g:tg.f, color:'var(--fat)'},
    {label:'蛋白質', v:P, g:tg.p, color:'var(--protein)'},
    {label:'熱量', v:K, g:tgK, color:'var(--kcal)', unit:''},
  ];
  totalsGrid.innerHTML = cells.map(x=>{
    const pct = x.g>0 ? Math.min(100, x.v/x.g*100) : (x.v>0?100:0);
    const over = x.v > x.g;
    return `<div class="tot">
      <div class="v ${over?'over':''}" style="color:${over?'':x.color}">${Math.round(x.v*10)/10}</div>
      <div class="goal">/ ${x.g}${x.unit===''?'':'g'}</div>
      <div class="t">${x.label}</div>
      <div class="bar"><i style="width:${pct}%; background:${over?'var(--no)':x.color}"></i></div>
    </div>`;
  }).join('');

  foodList.innerHTML = day.foods.length ? day.foods.map((x,i)=>
    `<div class="food">
      <div class="name">${x.n}<div class="macros">碳 ${x.c}｜脂 ${x.f}｜蛋 ${x.p}</div></div>
      <div class="kc">${kcalOf(x.c,x.f,x.p)} 卡</div>
      <button class="del" onclick="delFood(${i})">✕</button>
    </div>`).join('')
    : '<div class="empty">尚未記錄，從上方新增</div>';

  const dates = [];
  for(let i=0;i<14;i++){
    const d=new Date(); d.setDate(d.getDate()-i);
    dates.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'));
  }
  const rows = dates.filter(ds=>store.days[ds] && store.days[ds].foods.length).map(ds=>{
    const dd=store.days[ds]; let k=0; dd.foods.forEach(x=>k+=kcalOf(x.c,x.f,x.p));
    const t2=store.settings.targets[dd.type];
    const tk = kcalOf(t2.c,t2.f,t2.p);
    const wd = '日一二三四五六'[new Date(ds+'T12:00:00').getDay()];
    return `<div class="hist" onclick="curDate='${ds}';render();window.scrollTo(0,0)">
      <span class="d">${ds.slice(5).replace('-','/')}（${wd}）</span>
      <span class="tag tag-${DAY_TYPES[dd.type].cls}">${DAY_TYPES[dd.type].name}</span>
      <span class="hk ${k<=tk?'ok':'ng'}">${k} / ${tk}</span>
    </div>`;
  });
  histList.innerHTML = rows.length ? rows.join('') : '<div class="empty">還沒有紀錄</div>';
}

// ===== settings =====
function openSettings(){
  const t=store.settings.targets;
  for(const k of ['low','no','high']){
    document.getElementById('s_'+k+'_c').value=t[k].c;
    document.getElementById('s_'+k+'_f').value=t[k].f;
    document.getElementById('s_'+k+'_p').value=t[k].p;
  }
  prevKcal();
  weekGrid.innerHTML = ['日','一','二','三','四','五','六'].map((w,i)=>
    `<div><div class="wd">${w}</div><select id="wk${i}">${Object.entries(DAY_TYPES).map(([k,v])=>
      `<option value="${k}" ${store.settings.week[i]===k?'selected':''}>${v.name.slice(0,2)}</option>`).join('')}</select></div>`).join('');
  settingsModal.classList.add('show');
}
function prevKcal(){
  for(const k of ['low','no','high']){
    const c=num(document.getElementById('s_'+k+'_c').value),
          f=num(document.getElementById('s_'+k+'_f').value),
          p=num(document.getElementById('s_'+k+'_p').value);
    document.getElementById('s_'+k+'_k').textContent = kcalOf(c,f,p);
  }
}
function closeSettings(){ settingsModal.classList.remove('show'); }
function saveSettings(){
  for(const k of ['low','no','high']){
    store.settings.targets[k] = {
      c:num(document.getElementById('s_'+k+'_c').value),
      f:num(document.getElementById('s_'+k+'_f').value),
      p:num(document.getElementById('s_'+k+'_p').value),
    };
  }
  store.settings.week = [0,1,2,3,4,5,6].map(i=>document.getElementById('wk'+i).value);
  markDirty('settings');
  closeSettings(); render();
}
function exportData(){
  const blob = new Blob([JSON.stringify(store,null,2)],{type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'carbcycle-backup-'+todayStr()+'.json';
  a.click();
}
function importData(inp){
  const f = inp.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = ()=>{
    try{
      const s = JSON.parse(r.result);
      // 新版格式
      if(s.days && s.settings){ store = {settings:s.settings, lib:s.lib||{}, days:s.days}; }
      // 舊版單機格式 (targets/week 在最上層)
      else if(s.days && s.targets){ store = {settings:{targets:s.targets, week:s.week||DEFAULTS.week.slice()}, lib:s.lib||{}, days:s.days}; }
      else { alert('檔案格式不正確'); return; }
      dirty.add('settings'); dirty.add('lib');
      Object.keys(store.days).forEach(d=>dirty.add('day:'+d));
      persistLocal(); scheduleSync();
      closeSettings(); render(); alert('匯入成功，將自動同步到雲端');
    }catch(e){ alert('讀取失敗'); }
  };
  r.readAsText(f);
  inp.value='';
}

render();
initAuth();
</script>
